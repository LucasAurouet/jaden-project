# Migrations du schéma Postgres (serveur uniquement).
# L'URL de la base n'est pas ici : env.py la lit dans config.py (DATABASE_URL).

[alembic]
script_location = %(here)s/src/api/migrations
prepend_sys_path = .
path_separator = os
# Fichiers nommés par date pour qu'ils se lisent dans l'ordre : 20261016_1530_<rev>_<slug>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
